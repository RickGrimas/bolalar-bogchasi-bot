    <circle cx="60" cy="20" r="22" fill="#fbbf24" opacity="0.9" />
  </g>
  <text x="400" y="420" font-family="'Fredoka', 'Quicksand', sans-serif" font-weight="700" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    🤖 STEM va Robototexnika Xonasi
