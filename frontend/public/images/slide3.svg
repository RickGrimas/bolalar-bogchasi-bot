    <rect x="-40" y="-50" width="80" height="60" rx="12" fill="#818cf8" stroke="#ffffff" stroke-width="4" />
    <circle cx="-18" cy="-25" r="8" fill="#38bdf8" />
    <circle cx="18" cy="-25" r="8" fill="#38bdf8" />
    <rect x="-15" y="-5" width="30" height="6" rx="3" fill="#ffffff" />
