      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="30" fill="url(#bg3)" />
  <circle cx="200" cy="200" r="140" fill="#a855f7" opacity="0.15" />
  <g transform="translate(400, 210) scale(1.8)">
